<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>現場日報</title>
  <!-- Supabaseを使うための道具（ライブラリ）を読み込む -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: sans-serif; max-width: 640px; margin: 24px auto; padding: 0 16px; }
    form { display: grid; gap: 8px; padding: 16px; border: 1px solid #ccc; border-radius: 8px; }
    label { font-size: 14px; }
    input, select, textarea, button { font-size: 16px; padding: 6px; width: 100%; box-sizing: border-box; }
    button { background: #2563eb; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
    button:disabled { background: #9ca3af; }
    #logout { background: #6b7280; width: auto; padding: 4px 12px; }
    .bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .msg { min-height: 1.5em; font-weight: bold; }
    .hidden { display: none; }
    #list { list-style: none; padding: 0; }
    #list li { border-bottom: 1px solid #eee; padding: 8px 0; }
    #list img { display: block; max-width: 200px; margin-top: 6px; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>現場日報</h1>

  <!-- ===== ログイン画面（ログインしていない時だけ表示） ===== -->
  <div id="login-area">
    <form id="login-form">
      <label>メールアドレス <input type="email" id="email" required></label>
      <label>パスワード <input type="password" id="password" required></label>
      <button type="submit">ログイン</button>
    </form>
    <p id="login-message" class="msg"></p>
  </div>

  <!-- ===== 日報画面（ログイン中だけ表示） ===== -->
  <div id="app-area" class="hidden">
    <div class="bar">
      <span id="who"></span>
      <button id="logout">ログアウト</button>
    </div>

    <form id="form">
      <label>作業日 <input type="date" id="work_date" required></label>
      <label>現場名 <input type="text" id="site_name" required></label>
      <label>天気
        <select id="weather">
          <option>晴れ</option>
          <option>曇り</option>
          <option>雨</option>
          <option>雪</option>
        </select>
      </label>
      <label>作業内容 <textarea id="content" rows="3" required></textarea></label>
      <!-- 今回の新ネタ：写真の選択欄 -->
      <label>📷 撮影する <input type="file" id="camera" accept="image/*" capture="environment"></label>
      <label>🖼 ギャラリーから選ぶ <input type="file" id="photo" accept="image/*"></label>
      <button type="submit" id="submit-btn">登録</button>
    </form>
    <p id="message" class="msg"></p>

    <h2>日報一覧</h2>
    <ul id="list">読み込み中...</ul>
  </div>

  <script>
    // ▼▼▼ ここの2行だけ、自分のものに書き換える ▼▼▼
    const SUPABASE_URL = 'https://ncgltqwljxlpsjkefblk.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_HFk6z3wotdYACS78274hmQ_yx4EZunf';
    // ▲▲▲ ここまで ▲▲▲

    const BUCKET = 'report-photos'; // 写真を入れる箱（バケット）の名前

    // Supabaseにつなぐ
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null; // 今ログインしている人

    // 作業日の初期値を今日にしておく
    document.getElementById('work_date').value = new Date().toLocaleDateString('sv-SE');

    // ===== ログイン状態に合わせて画面を切り替える =====
    function showScreen(session) {
      if (session) {
        currentUser = session.user;
        document.getElementById('login-area').classList.add('hidden');
        document.getElementById('app-area').classList.remove('hidden');
        document.getElementById('who').textContent = session.user.email + ' でログイン中';
        load();
      } else {
        currentUser = null;
        document.getElementById('login-area').classList.remove('hidden');
        document.getElementById('app-area').classList.add('hidden');
      }
    }

    db.auth.onAuthStateChange((event, session) => {
      showScreen(session);
    });

    // ===== ログインボタン =====
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const { error } = await db.auth.signInWithPassword({
        email:    document.getElementById('email').value,
        password: document.getElementById('password').value,
      });
      const msg = document.getElementById('login-message');
      if (error) {
        msg.style.color = 'red';
        msg.textContent = 'ログインできませんでした：' + error.message;
      } else {
        msg.textContent = '';
        document.getElementById('password').value = '';
      }
    });

    // ===== ログアウトボタン =====
    document.getElementById('logout').addEventListener('click', async () => {
      await db.auth.signOut();
    });

    // ===== 一覧を読み込む =====
    async function load() {
      const { data, error } = await db
        .from('reports')
        .select('*')
        .order('work_date', { ascending: false });

      const list = document.getElementById('list');
      list.innerHTML = '';

      if (error) {
        list.textContent = 'エラー：' + error.message;
        return;
      }
      if (data.length === 0) {
        list.textContent = 'データが0件です';
        return;
      }

      for (const r of data) {
        const li = document.createElement('li');
        li.textContent = `${r.work_date}｜${r.site_name}｜${r.weather}｜${r.content}`;

        // 今回の新ネタ：写真があれば「期限付きの閲覧URL」をもらって表示
        if (r.photo_path) {
          const { data: signed } = await db.storage
            .from(BUCKET)
            .createSignedUrl(r.photo_path, 60 * 60); // 1時間だけ有効なURL
          if (signed) {
            const img = document.createElement('img');
            img.src = signed.signedUrl;
            li.appendChild(img);
          }
        }
        list.appendChild(li);
      }
    }

    // ===== 登録ボタン =====
    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const message = document.getElementById('message');
      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      message.style.color = 'black';
      message.textContent = '登録中...';

      // --- 今回の新ネタ：写真があれば先にStorageへアップロード ---
      let photoPath = null;
            const file = document.getElementById('camera').files[0] || document.getElementById('photo').files[0];
      if (file) {
        // 保存場所は「自分のユーザーID/日時.拡張子」
        // （日本語のファイル名はトラブルの元なので、日時に付け替える）
        const ext = file.name.split('.').pop();
        photoPath = `${currentUser.id}/${Date.now()}.${ext}`;

        const { error: upError } = await db.storage
          .from(BUCKET)
          .upload(photoPath, file);

        if (upError) {
          message.style.color = 'red';
          message.textContent = '写真をアップできませんでした：' + upError.message;
          btn.disabled = false;
          return;
        }
      }

      // --- 日報を登録（写真の保存場所もいっしょに記録） ---
      const newReport = {
        work_date:  document.getElementById('work_date').value,
        site_name:  document.getElementById('site_name').value,
        weather:    document.getElementById('weather').value,
        content:    document.getElementById('content').value,
        photo_path: photoPath,
      };

      const { error } = await db.from('reports').insert(newReport);
      btn.disabled = false;

      if (error) {
        message.style.color = 'red';
        message.textContent = '登録できませんでした：' + error.message;
        return;
      }

      message.style.color = 'green';
      message.textContent = '登録しました！';
      document.getElementById('site_name').value = '';
      document.getElementById('content').value = '';
      document.getElementById('photo').value = '';
      document.getElementById('camera').value = '';
      load();
    });
  </script>
</body>
</html>
